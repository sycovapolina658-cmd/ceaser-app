<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Цезарь</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121214; color: #e1e1e6; height: 100vh; display: flex; flex-direction: column; }
    
    .header { background: #1a1a1e; padding: 12px 16px; border-bottom: 1px solid #29292e; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #8257e5; }
    .info { flex: 1; }
    .name { font-weight: bold; font-size: 16px; color: #fff; }
    .status-bar { font-size: 12px; color: #a8a8b3; margin-top: 4px; }
    .progress-outer { width: 100%; height: 6px; background: #29292e; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .progress-inner { height: 100%; width: 15%; background: linear-gradient(90deg, #8257e5, #ff5555); transition: width 0.3s ease; }

    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14.5px; line-height: 1.45; word-wrap: break-word; }
    .msg.bot { background: #202024; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #29292e; }
    .msg.user { background: #8257e5; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }

    .action { font-style: italic; opacity: 0.6; font-weight: 300; color: #d0d0d5; }

    .input-area { padding: 12px; background: #1a1a1e; border-top: 1px solid #29292e; display: flex; gap: 8px; }
    textarea { flex: 1; background: #121214; border: 1px solid #29292e; color: #fff; padding: 10px; border-radius: 8px; resize: none; height: 42px; outline: none; font-size: 14px; }
    button { background: #8257e5; color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://i.ibb.co/L9H8v7P/caesar.jpg" alt="Цезарь" class="avatar" onerror="this.src='https://via.placeholder.com/44'">
    <div class="info">
      <div class="name">Цезарь</div>
      <div class="status-bar">Отношения: Заинтригован (15%)</div>
      <div class="progress-outer">
        <div class="progress-inner"></div>
      </div>
    </div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">
      <span class="action">Отделяется от группы гостей и останавливается рядом, держа бокал за тонкую ножку.</span> Все в этом зале старательно делают вид, что не смотрят на меня. А вы — единственный человек, который даже не пытается. <span class="action">Чуть склоняет голову.</span> Смелость или незнание?
    </div>
  </div>

  <div class="input-area">
    <textarea id="userInput" placeholder="Напишите сообщение..."></textarea>
    <button onclick="sendMsg()">Отпр.</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function formatText(text) {
      return text.replace(/\*(.*?)\*/g, '<span class="action">$1</span>');
    }

    function sendMsg() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const text = input.value.trim();
      if (!text) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerHTML = formatText(text);
      chatBox.appendChild(userDiv);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
